services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: platform
      POSTGRES_PASSWORD: "${DB_PASSWORD:-SecurePostgres2026!}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/policies/rls.sql:/docker-entrypoint-initdb.d/02_rls.sql:ro
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - private

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: "postgresql://app:${DB_PASSWORD:-SecurePostgres2026!}@db:5432/platform"
      SECRET_KEY: "${SECRET_KEY:-prod-secret-key-32chars-minimum-enterprise!}"
      CRM_WEBHOOK_SECRET: "${CRM_WEBHOOK_SECRET:-crm-webhook-secret-key-32chars-min!}"
      REDIS_URL: "redis://redis:6379/0"
      ENVIRONMENT: "production"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - private
      - public

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - public

volumes:
  pgdata:
  redisdata:

networks:
  private:
    internal: true
  public:
